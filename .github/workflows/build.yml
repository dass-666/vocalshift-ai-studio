name: Build and validate

on:
  push:
    branches: [ main, "feat/**", "fix/**", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4
  BUILD_DIR: build

jobs:
  windows:
    name: Windows x64 (MSVC, Release)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B ${{ env.BUILD_DIR }} -G "Visual Studio 17 2022" -A x64 -DVS_BUILD_TESTS=ON -DVS_BUILD_BENCH=ON

      - name: Build (Release)
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 4 2>&1 | Tee-Object -FilePath build-log.txt

      - name: Unit + DSP tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C Release --output-on-failure 2>&1 | Tee-Object -FilePath test-log.txt

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/${{ env.PLUGINVAL_VERSION }}/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval

      - name: pluginval (strictness 5, required)
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "${{ env.BUILD_DIR }}/VocalShift_artefacts/Release/VST3" -Filter *.vst3 | Select-Object -First 1
          .\pluginval\pluginval.exe --strictness-level 5 --validate-in-process --output-dir pluginval-logs "$($vst3.FullName)" 2>&1 | Tee-Object -FilePath pluginval-5.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: pluginval (strictness 10, informative)
        shell: pwsh
        continue-on-error: true
        run: |
          $vst3 = Get-ChildItem -Path "${{ env.BUILD_DIR }}/VocalShift_artefacts/Release/VST3" -Filter *.vst3 | Select-Object -First 1
          .\pluginval\pluginval.exe --strictness-level 10 --validate-in-process "$($vst3.FullName)" 2>&1 | Tee-Object -FilePath pluginval-10.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: QualityBench (synthetic A/B renders)
        shell: pwsh
        run: |
          $bench = Get-ChildItem -Path "${{ env.BUILD_DIR }}/bench" -Recurse -Filter vs_bench.exe | Select-Object -First 1
          & $bench.FullName --out bench-out

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse "${{ env.BUILD_DIR }}/VocalShift_artefacts/Release/VST3/*.vst3" package/
          Copy-Item docs/FL_STUDIO_GUIDE.md package/
          Copy-Item THIRD_PARTY_NOTICES.md package/

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalShift-AI-Studio-VST3-Windows-x64
          path: package/
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows
          path: |
            build-log.txt
            test-log.txt
            pluginval-5.txt
            pluginval-10.txt
            pluginval-logs/
          if-no-files-found: warn

      - name: Upload A/B renders
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bench-renders-synthetic
          path: bench-out/

  linux:
    name: Linux x64 (reference, tests + pluginval)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libxi-dev \
            libxcomposite-dev libxrender-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVS_BUILD_BENCH=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: pluginval (strictness 10)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip -d pluginval
          xvfb-run -a ./pluginval/pluginval --strictness-level 10 --validate-in-process \
            "build/VocalShift_artefacts/Release/VST3/VocalShift AI Studio.vst3"
